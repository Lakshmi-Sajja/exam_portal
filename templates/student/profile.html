{% extends 'base.html' %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">

<h2 class="mb-4">My Profile</h2>

<form method="POST" action="{{ url_for('student.profile') }}">

    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control"
               value="{{ user.name }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ user.email }}" disabled>
        <div class="form-text">Email cannot be changed.</div>
    </div>

    {% if profile %}
    <div class="mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" class="form-control" value="{{ profile.roll_number or '' }}" disabled>
        <div class="form-text">Roll number is set by the administrator.</div>
    </div>

    <div class="mb-3">
        <label class="form-label">Department</label>
        <input type="text" class="form-control" value="{{ profile.department or '' }}" disabled>
    </div>

    <div class="mb-3">
        <label class="form-label">Contact Number</label>
        <input type="text" name="contact" class="form-control"
               value="{{ profile.contact or '' }}" placeholder="e.g. 9876543210">
    </div>
    {% endif %}

    <hr>
    <h5 class="mb-3">Change Password <small class="text-muted fs-6">(leave blank to keep current)</small></h5>

    <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control"
               placeholder="Minimum 6 characters" autocomplete="new-password">
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>

</form>

</div>
</div>
{% endblock %}
