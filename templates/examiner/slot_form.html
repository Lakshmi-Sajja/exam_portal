{% extends 'base.html' %}
{% block title %}{{ action }} Slot – {{ exam.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">

    <h2 class="mb-4">{{ action }} Slot — {{ exam.name }}</h2>

    <form method="POST">

      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input
          type="date"
          id="date"
          name="date"
          class="form-control"
          value="{{ slot.date.strftime('%Y-%m-%d') if slot else '' }}"
          required>
      </div>

      <div class="mb-3">
        <label for="start_time" class="form-label">Start Time</label>
        <input
          type="time"
          id="start_time"
          name="start_time"
          class="form-control"
          value="{{ slot.start_time.strftime('%H:%M') if slot else '' }}"
          required>
      </div>

      <div class="mb-3">
        <label for="end_time" class="form-label">End Time</label>
        <input
          type="time"
          id="end_time"
          name="end_time"
          class="form-control"
          value="{{ slot.end_time.strftime('%H:%M') if slot else '' }}"
          required>
      </div>

      <div class="mb-3">
        <label for="capacity" class="form-label">Capacity</label>
        <input
          type="number"
          id="capacity"
          name="capacity"
          class="form-control"
          min="1"
          value="{{ slot.capacity if slot else '' }}"
          required>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{ action }} Slot</button>
        <a href="{{ url_for('examiner.slots', exam_id=exam.id) }}" class="btn btn-outline-secondary">Cancel</a>
      </div>

    </form>

  </div>
</div>
{% endblock %}
