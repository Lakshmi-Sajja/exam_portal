{% extends 'base.html' %}
{% block title %}{{ action }} Course{% endblock %}

{% block content %}
<h2>{{ action }} Course</h2>
<hr>

<form method="POST" class="mt-3" style="max-width: 540px;">

  <div class="mb-3">
    <label for="code" class="form-label">Course Code <span class="text-danger">*</span></label>
    <input type="text" id="code" name="code" class="form-control"
           value="{{ course.code if course else '' }}" required>
  </div>

  <div class="mb-3">
    <label for="name" class="form-label">Course Name <span class="text-danger">*</span></label>
    <input type="text" id="name" name="name" class="form-control"
           value="{{ course.name if course else '' }}" required>
  </div>

  <div class="mb-3">
    <label for="description" class="form-label">Description</label>
    <textarea id="description" name="description" class="form-control" rows="3">{{ course.description if course else '' }}</textarea>
  </div>

  <div class="mb-3">
    <label for="status" class="form-label">Status</label>
    <select id="status" name="status" class="form-select">
      <option value="active"   {% if course and course.status == 'active'   %}selected{% endif %}>Active</option>
      <option value="inactive" {% if course and course.status == 'inactive' %}selected{% endif %}>Inactive</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">{{ action }} Course</button>
  <a href="{{ url_for('admin.courses') }}" class="btn btn-secondary ms-2">Cancel</a>

</form>
{% endblock %}
