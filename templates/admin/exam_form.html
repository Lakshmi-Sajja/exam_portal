{% extends 'base.html' %}
{% block title %}{{ action }} Exam{% endblock %}

{% block content %}
<h2>{{ action }} Exam</h2>
<hr>

<form method="POST" class="mt-3" style="max-width: 640px;">

  <div class="mb-3">
    <label for="name" class="form-label">Exam Name <span class="text-danger">*</span></label>
    <input type="text" id="name" name="name" class="form-control"
           value="{{ exam.name if exam else '' }}" required>
  </div>

  <div class="mb-3">
    <label for="course_id" class="form-label">Course <span class="text-danger">*</span></label>
    <select id="course_id" name="course_id" class="form-select" required>
      <option value="">— Select course —</option>
      {% for course in courses %}
      <option value="{{ course.id }}"
              {% if exam and exam.course_id == course.id %}selected{% endif %}>
        {{ course.code }} — {{ course.name }}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="examiner_id" class="form-label">Examiner</label>
    <select id="examiner_id" name="examiner_id" class="form-select">
      <option value="">— Assign later —</option>
      {% for examiner in examiners %}
      <option value="{{ examiner.id }}"
              {% if exam and exam.examiner_id == examiner.id %}selected{% endif %}>
        {{ examiner.name }} ({{ examiner.examiner_profile.department or 'No dept' }})
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="exam_type" class="form-label">Exam Type <span class="text-danger">*</span></label>
    <select id="exam_type" name="exam_type" class="form-select" required>
      {% for t in ['Viva', 'Practical', 'Project Demo', 'Assessment'] %}
      <option value="{{ t }}" {% if exam and exam.exam_type == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="row">
    <div class="col mb-3">
      <label for="duration" class="form-label">Duration (minutes) <span class="text-danger">*</span></label>
      <input type="number" id="duration" name="duration" class="form-control" min="1"
             value="{{ exam.duration if exam else '' }}" required>
    </div>
    <div class="col mb-3">
      <label for="max_marks" class="form-label">Max Marks <span class="text-danger">*</span></label>
      <input type="number" id="max_marks" name="max_marks" class="form-control" min="1"
             value="{{ exam.max_marks if exam else '' }}" required>
    </div>
  </div>

  <div class="row">
    <div class="col mb-3">
      <label for="slot_creation_start" class="form-label">Slot Creation Start</label>
      <input type="date" id="slot_creation_start" name="slot_creation_start" class="form-control"
             value="{{ exam.slot_creation_start if exam else '' }}">
    </div>
    <div class="col mb-3">
      <label for="slot_creation_end" class="form-label">Slot Creation End</label>
      <input type="date" id="slot_creation_end" name="slot_creation_end" class="form-control"
             value="{{ exam.slot_creation_end if exam else '' }}">
    </div>
  </div>

  <div class="row">
    <div class="col mb-3">
      <label for="booking_start" class="form-label">Booking Start</label>
      <input type="date" id="booking_start" name="booking_start" class="form-control"
             value="{{ exam.booking_start if exam else '' }}">
    </div>
    <div class="col mb-3">
      <label for="booking_end" class="form-label">Booking End</label>
      <input type="date" id="booking_end" name="booking_end" class="form-control"
             value="{{ exam.booking_end if exam else '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label for="status" class="form-label">Status</label>
    <select id="status" name="status" class="form-select">
      {% for s in ['Draft', 'Slot Creation', 'Booking Open', 'Closed', 'Completed'] %}
      <option value="{{ s }}" {% if exam and exam.status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>

  <button type="submit" class="btn btn-primary">{{ action }} Exam</button>
  <a href="{{ url_for('admin.exams') }}" class="btn btn-secondary ms-2">Cancel</a>

</form>
{% endblock %}
